<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液态玻璃画布</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;gap:28px;background:#08163a;color:#e8f6ff}
.stage{position:relative;flex:none;width:min(var(--canvas-width,43vh),calc(100vw - 380px));aspect-ratio:var(--canvas-ratio,1080/2356);overflow:hidden;background:#05080c;box-shadow:0 18px 80px #0008;touch-action:none}
.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
.code-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glass{position:absolute;left:28%;top:52%;width:62%;height:28%;min-width:0;min-height:0;border:1px solid #ffffff60;border-radius:var(--glass-radius,100px);background:var(--glass-tint,rgba(222,242,255,.022));backdrop-filter:var(--hyalite,blur(.25px));-webkit-backdrop-filter:var(--hyalite,blur(.25px));box-shadow:var(--hyalite-edge,inset 0 0 0 1px #ffffff88),0 18px 40px #0358ad27;cursor:grab;touch-action:none;overflow:visible}
.glass.circle{height:auto;aspect-ratio:1;border-radius:50%}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 82% 68% at 9% -15%,#ffffff4a,transparent 70%),linear-gradient(128deg,#ffffff24,transparent 32%,transparent 68%,#83caff13);pointer-events:none}
.glass:after{content:"";position:absolute;inset:1px;border-radius:inherit;box-shadow:inset 1px 1px 2px #ffffffb0,inset -1px -1px 2px #536bb35c;pointer-events:none}
@property --glow-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
.glow-halo{position:absolute;inset:var(--glow-outset,-6px);border-radius:calc(var(--glass-radius,100px) + var(--glow-radius-add,6px));filter:blur(var(--glow-spread,12px)) brightness(var(--glow-brightness,1));opacity:var(--glow-alpha,.24);pointer-events:none}
.glass.circle .glow-halo{border-radius:50%}
.glow-halo:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--glow-area,12px);background:conic-gradient(from var(--glow-angle),var(--glow-stops));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:glow-spin var(--glow-duration,14s) linear infinite}
@keyframes glow-spin{to{--glow-angle:360deg}}
.animation-paused .glow-halo:after{animation-play-state:paused}
.glass.dragging{cursor:grabbing}
.resize{position:absolute;right:1%;bottom:1%;width:13%;height:13%;min-width:18px;min-height:18px;cursor:nwse-resize;z-index:2}
.glass.circle .resize{right:10%;bottom:10%;width:14%;height:14%;min-width:22px;min-height:22px}
.resize:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border:1px solid #fff;border-radius:50%;background:#52bdff;box-shadow:0 0 0 2px #1044a474;opacity:0}
.glass:hover .resize:after,.glass.selected .resize:after,.glass:focus-within .resize:after{opacity:1}
.glass-delete{position:absolute;right:8px;top:8px;z-index:3;width:24px;height:24px;border:1px solid #ffffffa0;border-radius:50%;background:#102f65bd;color:white;font:18px/20px sans-serif;cursor:pointer;opacity:0;pointer-events:none}
.glass:hover .glass-delete,.glass:focus-within .glass-delete{opacity:1;pointer-events:auto}
@media(hover:none){.glass-delete{opacity:.85;pointer-events:auto}}
.toolbar{width:280px;max-height:calc(100vh - 48px);overflow:auto;align-self:center;display:grid;gap:9px}
.toolbar h1{font-size:18px;margin:0;font-weight:650}.toolbar p{font-size:13px;line-height:1.5;color:#aec9e7;margin:0 0 5px}.toolbar small{color:#93b7dc;font-size:12px;line-height:1.5}
.toolbar button,.toolbar select{appearance:none;border:1px solid #84c9ff6b;background:#0d3575;color:#fff;padding:10px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.toolbar button:hover,.toolbar select:hover{background:#15529e}.toolbar button:disabled{opacity:.45;cursor:default}
.toolbar button:focus-visible,.toolbar select:focus-visible,.toolbar summary:focus-visible,.glass:focus-visible,.control input:focus-visible{outline:3px solid #8ce6ff;outline-offset:3px}
.panel-group{border:1px solid #84c9ff45;border-radius:12px;background:#102e60a3;overflow:hidden}
.panel-group summary{cursor:pointer;padding:12px 13px;color:#e8f6ff;font-size:14px;font-weight:650;list-style:none}.panel-group summary::-webkit-details-marker{display:none}.panel-group summary:after{content:"＋";float:right;color:#83cfff}.panel-group[open] summary:after{content:"－"}.panel-group[open] summary{border-bottom:1px solid #84c9ff38}
.group-body{display:grid;gap:9px;padding:10px 12px 13px}
.control{display:grid;gap:6px;padding:3px 0}.control[hidden]{display:none}.control label{display:flex;justify-content:space-between;font-size:13px;color:#dceeff}.control output{font-variant-numeric:tabular-nums;color:#9de8ff}.control input{width:100%;accent-color:#78d8ff;cursor:pointer}
.control input[type=color]{width:58px;height:32px;padding:2px;border:1px solid #84c9ff6b;border-radius:7px;background:#0b284b}
.layout-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.layout-pair label{display:block}.layout-pair input{width:100%;padding:7px 8px;border:1px solid #84c9ff6b;border-radius:7px;background:#0b284b;color:#e8f6ff;font:inherit}
.frames{display:grid;gap:6px}.frame-row{display:grid;grid-template-columns:1fr auto auto;gap:5px}.toolbar .frame-row button{padding:7px 9px;font-size:12px}.frame-row button[aria-pressed=true]{border-color:#8ce6ff;background:#1765a4}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.color-chip{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid #a9dfff66;border-radius:8px}.color-chip input{width:27px;height:27px;padding:0;border:0;background:none;cursor:pointer}.color-chip button{border:0;background:none;padding:0 4px;color:#dceeff;font-size:19px}.toolbar #add-color{padding:5px 8px;font-size:12px}
.hide-ui{padding:0}.hide-ui .toolbar,.hide-ui .glass-delete,.hide-ui .resize{display:none}.hide-ui .stage{width:min(100vw,var(--canvas-record-width,45.84vh));box-shadow:none}
.show-ui{position:fixed;right:16px;top:16px;z-index:10;background:#0b2b67d9;border:1px solid #bceaff77;border-radius:9px;color:white;padding:9px 12px;cursor:pointer;display:none}.hide-ui .show-ui{display:block}
@media(max-width:800px){body{display:block;padding:0}.stage{width:min(100vw,var(--canvas-record-width,45.84vh));margin:auto}.toolbar{position:fixed;bottom:12px;left:12px;right:12px;width:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:42vh;overflow:auto;background:#061f53e8;padding:8px;border-radius:12px;z-index:5}.toolbar h1,.toolbar p,.toolbar small{display:none}.toolbar .panel-group{grid-column:span 2}.toolbar button{text-align:center}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="液态玻璃画布">
<img class="background" alt="" draggable="false">
<canvas class="code-overlay" id="code-overlay" aria-hidden="true"></canvas>
<div class="glass" tabindex="0" aria-label="可拖动和调整大小的液态玻璃框"><button class="glass-delete" type="button" aria-label="删除此玻璃框">×</button><span class="resize" aria-label="调整玻璃框大小"></span></div>
</main>
<aside class="toolbar" aria-label="画布控制">
<h1>液态玻璃画布</h1><p>上传图片背景。添加并选中玻璃框，拖动或输入数值排版。</p>
<details class="panel-group" open><summary>背景图片</summary><div class="group-body">
<div class="control"><label for="background-upload">上传图片</label><input id="background-upload" type="file" accept="image/*"></div>
<small id="background-status">默认背景已加载；上传后会重新识别浅色区域。</small>
</div></details>
<details class="panel-group" open><summary>画面尺寸与排版 · <span id="selected-name">圆角框 1</span></summary><div class="group-body">
<div class="control"><label for="format">画面尺寸</label><select id="format"><option value="1080x2356">1080 × 2356 · 当前版</option><option value="1080x1920">1080 × 1920 · 9:16 竖屏</option><option value="1080x1350">1080 × 1350 · 4:5 竖图</option><option value="1080x1080">1080 × 1080 · 1:1 方形</option><option value="1920x1080">1920 × 1080 · 16:9 横屏</option></select></div>
<small>切换尺寸后，图片居中铺满画布。</small>
<button id="add">＋ 添加圆角框</button><button id="add-circle">＋ 添加圆形框</button><div class="frames" id="frames" aria-label="玻璃框列表"></div>
<div class="layout-pair"><div class="control"><label for="frame-x">X 位置 %</label><input id="frame-x" type="number" step="0.1"></div><div class="control"><label for="frame-y">Y 位置 %</label><input id="frame-y" type="number" step="0.1"></div></div>
<div class="control"><label for="frame-width"><span id="width-label">宽度</span> <output id="frame-width-value">62%</output></label><input id="frame-width" type="range" min="5" max="200" value="62"></div>
<div class="control" id="frame-height-control"><label for="frame-height">高度 <output id="frame-height-value">28%</output></label><input id="frame-height" type="range" min="5" max="200" value="28"></div>
<button id="clear">移除全部玻璃框</button>
</div></details>
<details class="panel-group"><summary>玻璃材质</summary><div class="group-body">
<div class="control"><label for="radius">圆角 <output id="radius-value">100 px</output></label><input id="radius" type="range" min="0" max="160" value="100"></div>
<div class="control"><label for="transparency">透明度 <output id="transparency-value">96%</output></label><input id="transparency" type="range" min="0" max="100" value="96"></div>
<div class="control"><label for="ior">折射率 <output id="ior-value">1.20</output></label><input id="ior" type="range" min="101" max="220" value="120"></div>
<div class="control"><label for="thickness">透镜厚度 <output id="thickness-value">66 px</output></label><input id="thickness" type="range" min="10" max="160" value="66"></div>
<div class="control"><label for="dispersion">边缘色散 <output id="dispersion-value">2.0 px</output></label><input id="dispersion" type="range" min="0" max="60" value="20"></div>
<div class="control"><label for="code-blur">框下字符模糊 <output id="code-blur-value">3 px</output></label><input id="code-blur" type="range" min="0" max="12" value="3"></div>
</div></details>
<details class="panel-group"><summary>边框发光</summary><div class="group-body">
<div class="control"><label for="glow">光晕亮度 <output id="glow-value">100%</output></label><input id="glow" type="range" min="50" max="200" value="100"></div>
<div class="control"><label for="glow-transparency">光晕透明度 <output id="glow-transparency-value">76%</output></label><input id="glow-transparency" type="range" min="0" max="100" value="76"></div>
<div class="control"><label for="glow-spread">发散 <output id="glow-spread-value">12 px</output></label><input id="glow-spread" type="range" min="0" max="40" value="12"></div>
<div class="control"><label for="glow-area">发光面积 <output id="glow-area-value">12 px</output></label><input id="glow-area" type="range" min="2" max="36" value="12"></div>
<div class="control"><label for="glow-speed">光带循环 <output id="glow-speed-value">14 秒/圈</output></label><input id="glow-speed" type="range" min="5" max="40" value="14"></div>
<div class="control"><label>发光颜色</label><div class="colors" id="colors"><button id="add-color" type="button">＋ 添加颜色</button></div></div>
</div></details>
<details class="panel-group"><summary>代码字符</summary><div class="group-body">
<div class="control"><label for="code-color">字符颜色 <input id="code-color" type="color" value="#3477c0"></label></div>
<div class="control"><label for="code-density">字符密度 <output id="code-density-value">100%</output></label><input id="code-density" type="range" min="25" max="200" value="100"></div>
<div class="control"><label for="code-size">字符大小 <output id="code-size-value">12 px</output></label><input id="code-size" type="range" min="6" max="32" value="12"></div>
<div class="control"><label for="code-opacity">字符亮度 <output id="code-opacity-value">8%</output></label><input id="code-opacity" type="range" min="0" max="100" value="8"></div>
<div class="control"><label for="code-speed">字符变化速度 <output id="code-speed-value">100%</output></label><input id="code-speed" type="range" min="0" max="300" value="100"></div>
</div></details>
<button id="toggle">暂停动画</button><button id="hide">隐藏控件录制</button>
<small>Ctrl/⌘+Z 撤销 · H 显示或隐藏控件 · 空格暂停动画</small>
</aside>
<button class="show-ui" id="show">显示控件</button>
<script src="hyalite.js"></script>
<script src="background-data.js"></script>
<script>
const stage=document.querySelector('#stage');
const format=document.querySelector('#format');
const background=document.querySelector('.background'),codeCanvas=document.querySelector('#code-overlay'),codeContext=codeCanvas.getContext('2d');
const codeSource=document.createElement('canvas'),sourceContext=codeSource.getContext('2d');
const sampleCanvas=document.createElement('canvas'),sample=sampleCanvas.getContext('2d',{willReadFrequently:true});
const maskCanvas=document.createElement('canvas'),mask=maskCanvas.getContext('2d');
const codeSettings={color:'#3477c0',density:1,size:12,opacity:.08,speed:1};
const codeLines=['let moon = sky.tint(7);','if (rain) bloom();','const spark = light + 1;','for (let star of sky) star.glow();','return coffee?.refill();','while (dreaming) render();','pixel.blue = wave(t);','await sunrise.fadeIn();'];
let sampleWidth=540,sampleHeight=1178,lightPixels=null,lightThreshold=145,codeGlyphs=[],codeTime=0;
function rebuildCodeGlyphs(){codeGlyphs=[];const spacing=1/Math.sqrt(codeSettings.density);for(let row=0,y=20;y<codeCanvas.height;row++,y+=44*spacing)for(let col=0,x=10;x<codeCanvas.width;col++,x+=27*spacing)if((row*71+col*53)%101>3)codeGlyphs.push({x,y,row,col,phase:(row*7+col*11)%13})}
function glyphChar(g,t=codeTime){const line=codeLines[(g.row+Math.floor(t/1.8+g.row*.23))%codeLines.length]+'      ',ch=line[g.col%line.length];return /\d/.test(ch)?String((Number(ch)+Math.floor(t*3.5+g.phase))%10):ch}
function captureLightMap(){if(!background.naturalWidth)return;const w=background.naturalWidth,h=background.naturalHeight,scale=Math.max(sampleWidth/w,sampleHeight/h),dw=w*scale,dh=h*scale;sample.clearRect(0,0,sampleWidth,sampleHeight);sample.drawImage(background,(sampleWidth-dw)/2,(sampleHeight-dh)/2,dw,dh);try{lightPixels=sample.getImageData(0,0,sampleWidth,sampleHeight).data}catch{lightPixels=null;return}const histogram=new Uint32Array(256);for(let i=0;i<lightPixels.length;i+=16){const l=Math.round(.2126*lightPixels[i]+.7152*lightPixels[i+1]+.0722*lightPixels[i+2]);histogram[l]++}let count=0;for(let i=0;i<256;i++){count+=histogram[i];if(count>=lightPixels.length/16*.25){lightThreshold=Math.max(115,Math.min(170,i-24));break}}const image=mask.createImageData(sampleWidth,sampleHeight);for(let i=0;i<lightPixels.length;i+=4){const l=.2126*lightPixels[i]+.7152*lightPixels[i+1]+.0722*lightPixels[i+2];image.data[i]=image.data[i+1]=image.data[i+2]=255;image.data[i+3]=l>=lightThreshold?255:0}mask.putImageData(image,0,0);drawCode()}
function drawCode(){sourceContext.clearRect(0,0,codeCanvas.width,codeCanvas.height);if(!lightPixels||!codeSettings.opacity){codeContext.clearRect(0,0,codeCanvas.width,codeCanvas.height);return}sourceContext.font=`${codeSettings.size}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;sourceContext.textBaseline='middle';const n=parseInt(codeSettings.color.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;for(const glyph of codeGlyphs){const ch=glyphChar(glyph);if(ch===' ')continue;const x=Math.min(sampleWidth-1,Math.floor(glyph.x/2)),y=Math.min(sampleHeight-1,Math.floor(glyph.y/2)),i=(y*sampleWidth+x)*4,l=.2126*lightPixels[i]+.7152*lightPixels[i+1]+.0722*lightPixels[i+2],strength=Math.min(1,(l-lightThreshold)/55);if(strength<=0)continue;sourceContext.fillStyle=`rgba(${r},${g},${b},${(codeSettings.opacity*strength).toFixed(3)})`;sourceContext.fillText(ch,glyph.x,glyph.y)}sourceContext.globalCompositeOperation='destination-in';sourceContext.imageSmoothingEnabled=false;sourceContext.drawImage(maskCanvas,0,0,codeCanvas.width,codeCanvas.height);sourceContext.globalCompositeOperation='source-over';paintCodeLayers()}
function paintCodeLayers(){const w=codeCanvas.width,h=codeCanvas.height;codeContext.clearRect(0,0,w,h);if(!lightPixels||!codeSettings.opacity)return;codeContext.drawImage(codeSource,0,0);const stageBox=stage.getBoundingClientRect(),sx=w/stageBox.width,sy=h/stageBox.height;for(const panel of stage.querySelectorAll('.glass')){const blur=panel.settings?.codeBlur??3;if(!blur)continue;const box=panel.getBoundingClientRect(),x=(box.left-stageBox.left)*sx,y=(box.top-stageBox.top)*sy,pw=box.width*sx,ph=box.height*sy;if(x>=w||y>=h||x+pw<=0||y+ph<=0)continue;const radius=panel.classList.contains('circle')?Math.min(pw,ph)/2:Math.min(pw/2,ph/2,parseFloat(getComputedStyle(panel).borderTopLeftRadius)*sx),pad=blur*3,left=Math.max(0,Math.floor(x-pad)),top=Math.max(0,Math.floor(y-pad)),right=Math.min(w,Math.ceil(x+pw+pad)),bottom=Math.min(h,Math.ceil(y+ph+pad));codeContext.save();codeContext.beginPath();codeContext.roundRect(x,y,pw,ph,radius);codeContext.clip();codeContext.clearRect(x,y,pw,ph);codeContext.filter=`blur(${blur}px)`;codeContext.drawImage(codeSource,left,top,right-left,bottom-top,left,top,right-left,bottom-top);codeContext.restore()}codeContext.globalCompositeOperation='destination-in';codeContext.imageSmoothingEnabled=false;codeContext.drawImage(maskCanvas,0,0,w,h);codeContext.globalCompositeOperation='source-over'}
let activeFormat=format.value;
function setFormat(value){activeFormat=value;const [w,h]=value.split('x').map(Number),ratio=w/h;stage.style.setProperty('--canvas-ratio',`${w}/${h}`);stage.style.setProperty('--canvas-width',`calc(${(ratio*100).toFixed(3)}vh - ${(ratio*48).toFixed(2)}px)`);stage.style.setProperty('--canvas-record-width',`${(ratio*100).toFixed(3)}vh`);stage.setAttribute('aria-label',`液态玻璃画布 ${w} × ${h}`);codeCanvas.width=codeSource.width=w;codeCanvas.height=codeSource.height=h;sampleWidth=maskCanvas.width=sampleCanvas.width=Math.ceil(w/2);sampleHeight=maskCanvas.height=sampleCanvas.height=Math.ceil(h/2);rebuildCodeGlyphs();captureLightMap();syncLayoutControls()}
format.onchange=()=>{const next=format.value;format.value=activeFormat;checkpoint();format.value=next;setFormat(next)};
const defaults={radius:100,transparency:96,ior:120,thickness:66,dispersion:20,codeBlur:3,glow:100,glowTransparency:76,glowSpread:12,glowArea:12,glowSpeed:14,colors:['#85e5ff','#b9a5ff','#ffffff']};
const glassControls=[['radius','radius',v=>v+' px'],['transparency','transparency',v=>v+'%'],['ior','ior',v=>(v/100).toFixed(2)],['thickness','thickness',v=>v+' px'],['dispersion','dispersion',v=>(v/10).toFixed(1)+' px'],['code-blur','codeBlur',v=>v+' px'],['glow','glow',v=>v+'%'],['glow-transparency','glowTransparency',v=>v+'%'],['glow-spread','glowSpread',v=>v+' px'],['glow-area','glowArea',v=>v+' px'],['glow-speed','glowSpeed',v=>v+' 秒/圈']];
const opticalControls=new Set(['ior','thickness','dispersion']);
const glassOpts=s=>({bevel:37,thickness:s.thickness,ior:s.ior/100,slope:.8,shape:'squircle',blur:.25,dispersion:s.dispersion/10,shade:.16,rim:1.8,edge:.42,edgeW:8,sat:1.05,smooth:1,settle:100});
function applyGlass(panel,optical=false,refresh=false){const s=panel.settings;panel.style.setProperty('--glass-radius',s.radius+'px');panel.style.setProperty('--glass-tint','rgba(222,242,255,'+((100-s.transparency)*.0055).toFixed(3)+')');panel.style.setProperty('--glow-brightness',s.glow/100);panel.style.setProperty('--glow-alpha',(100-s.glowTransparency)/100);panel.style.setProperty('--glow-spread',s.glowSpread+'px');panel.style.setProperty('--glow-area',s.glowArea+'px');panel.style.setProperty('--glow-outset',-s.glowArea/2+'px');panel.style.setProperty('--glow-radius-add',s.glowArea/2+'px');panel.style.setProperty('--glow-duration',s.glowSpeed+'s');const stops=s.colors.map((color,i)=>`${color} ${s.colors.length===1?90:30+i*120/(s.colors.length-1)}deg`);panel.style.setProperty('--glow-stops',`transparent 0deg, ${stops.join(', ')}, transparent 180deg, transparent 360deg`);if(optical){Hyalite.detach(panel);Hyalite.attach(panel,glassOpts(s))}else if(refresh)Hyalite.refresh(panel)}
let count=1,selected=null,paused=false,editKey=null;
const frameList=document.querySelector('#frames'),colors=document.querySelector('#colors');
const undoStack=[];
function snapshot(){const panels=[...stage.querySelectorAll('.glass')];return {backgroundSrc:background.src,backgroundStatus:document.querySelector('#background-status').textContent,format:activeFormat,count,paused,codeSettings:structuredClone(codeSettings),selected:panels.indexOf(selected),frames:panels.map(p=>({circle:p.classList.contains('circle'),name:p.dataset.name,left:p.style.left,top:p.style.top,width:p.style.width,height:p.style.height,settings:structuredClone(p.settings)}))}}
function checkpoint(){undoStack.push(snapshot());if(undoStack.length>60)undoStack.shift();editKey=null}
function beginControlEdit(key){if(editKey===key)return;checkpoint();editKey=key}
function undo(){const state=undoStack.pop();if(!state)return;editKey=null;stage.querySelectorAll('.glass').forEach(p=>{Hyalite.detach(p);p.remove()});selected=null;count=state.count;paused=state.paused;Object.assign(codeSettings,state.codeSettings);stage.classList.toggle('animation-paused',paused);document.querySelector('#toggle').textContent=paused?'继续动画':'暂停动画';format.value=state.format;setFormat(state.format);if(background.src!==state.backgroundSrc)background.src=state.backgroundSrc;document.querySelector('#background-status').textContent=state.backgroundStatus;for(const data of state.frames){const p=document.createElement('div');p.className=data.circle?'glass circle':'glass';p.tabIndex=0;p.dataset.name=data.name;p.settings=data.settings;p.setAttribute('aria-label','可拖动和调整大小的'+data.name);Object.assign(p.style,{left:data.left,top:data.top,width:data.width,height:data.height});p.innerHTML='<button class="glass-delete" type="button" aria-label="删除此玻璃框">×</button><span class="resize" aria-label="调整玻璃框大小"></span>';stage.append(p);wire(p)}selectFrame(stage.querySelectorAll('.glass')[state.selected]||null);renderCodeControls();paintCodeLayers()}
function renderColors(){colors.querySelectorAll('.color-chip').forEach(chip=>chip.remove());if(!selected)return;selected.settings.colors.forEach((value,index)=>{const chip=document.createElement('span'),input=document.createElement('input'),remove=document.createElement('button');chip.className='color-chip';input.type='color';input.value=value;input.setAttribute('aria-label','发光颜色 '+(index+1));remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','删除此颜色');input.oninput=()=>{beginControlEdit('color:'+selected.dataset.name+':'+index);selected.settings.colors[index]=input.value;applyGlass(selected)};input.onchange=()=>editKey=null;remove.onclick=()=>{if(selected.settings.colors.length>1){checkpoint();selected.settings.colors.splice(index,1);renderColors();applyGlass(selected)}};chip.append(input,remove);colors.insertBefore(chip,document.querySelector('#add-color'))})}
function renderGlassControls(){document.querySelector('#selected-name').textContent=selected?.dataset.name||'未选中';document.querySelector('#add-color').disabled=!selected;for(const [id,key,display] of glassControls){const input=document.querySelector('#'+id);input.disabled=!selected||(id==='radius'&&selected.classList.contains('circle'));if(selected){input.value=selected.settings[key];document.querySelector('#'+id+'-value').value=display(selected.settings[key])}}renderColors()}
for(const [id,key,display] of glassControls){const input=document.querySelector('#'+id);input.addEventListener('input',e=>{if(!selected)return;beginControlEdit(id+':'+selected.dataset.name);selected.settings[key]=Number(e.target.value);document.querySelector('#'+id+'-value').value=display(selected.settings[key]);if(key!=='codeBlur')applyGlass(selected,opticalControls.has(key),key==='radius');if(key==='codeBlur'||key==='radius')paintCodeLayers()});input.addEventListener('change',()=>editKey=null)}
document.querySelector('#add-color').onclick=()=>{if(!selected)return;checkpoint();selected.settings.colors.push('#8eeaff');renderColors();applyGlass(selected)};
function renderCodeControls(){document.querySelector('#code-color').value=codeSettings.color;for(const [id,value,display] of [['code-density',codeSettings.density*100,v=>v+'%'],['code-size',codeSettings.size,v=>v+' px'],['code-opacity',codeSettings.opacity*100,v=>v+'%'],['code-speed',codeSettings.speed*100,v=>v+'%']]){document.querySelector('#'+id).value=value;document.querySelector('#'+id+'-value').value=display(Math.round(value))}}
for(const [id,key,scale,display] of [['code-density','density',100,v=>v+'%'],['code-size','size',1,v=>v+' px'],['code-opacity','opacity',100,v=>v+'%'],['code-speed','speed',100,v=>v+'%']]){const input=document.querySelector('#'+id);input.addEventListener('input',()=>{beginControlEdit(id);codeSettings[key]=Number(input.value)/scale;document.querySelector('#'+id+'-value').value=display(Number(input.value));if(key==='density')rebuildCodeGlyphs();drawCode()});input.addEventListener('change',()=>editKey=null)}
const codeColor=document.querySelector('#code-color');codeColor.oninput=()=>{beginControlEdit('code-color');codeSettings.color=codeColor.value;drawCode()};codeColor.onchange=()=>editKey=null;
function syncLayoutControls(){const circle=selected?.classList.contains('circle');document.querySelector('#frame-height-control').hidden=!!circle;document.querySelector('#width-label').textContent=circle?'直径':'宽度';for(const id of ['frame-x','frame-y','frame-width','frame-height'])document.querySelector('#'+id).disabled=!selected;if(!selected)return;const stageBox=stage.getBoundingClientRect(),box=selected.getBoundingClientRect();const values={'frame-x':(box.left-stageBox.left)/stageBox.width*100,'frame-y':(box.top-stageBox.top)/stageBox.height*100,'frame-width':box.width/stageBox.width*100,'frame-height':box.height/stageBox.height*100};for(const [id,value] of Object.entries(values)){document.querySelector('#'+id).value=(Math.round(value*10)/10).toString();if(id==='frame-width'||id==='frame-height')document.querySelector('#'+id+'-value').value=Math.round(value)+'%'}}
for(const [id,property] of [['frame-x','left'],['frame-y','top'],['frame-width','width'],['frame-height','height']]){const input=document.querySelector('#'+id);input.addEventListener('input',e=>{if(!selected||e.target.value==='')return;beginControlEdit(id+':'+selected.dataset.name);selected.style[property]=e.target.value+'%';syncLayoutControls();paintCodeLayers()});input.addEventListener('change',()=>editKey=null)}
function selectFrame(panel){editKey=null;selected=panel;stage.querySelectorAll('.glass').forEach(p=>p.classList.toggle('selected',p===panel));renderFrameList();renderGlassControls();syncLayoutControls()}
function removeFrame(panel){checkpoint();Hyalite.detach(panel);panel.remove();selectFrame(selected===panel?stage.querySelector('.glass'):selected);paintCodeLayers()}
function renderFrameList(){frameList.replaceChildren();for(const panel of stage.querySelectorAll('.glass')){const row=document.createElement('div');row.className='frame-row';for(const [label,action] of [[panel.dataset.name,()=>selectFrame(panel)],['居中',()=>{checkpoint();const box=stage.getBoundingClientRect(),r=panel.getBoundingClientRect();panel.style.left=(.5-r.width/box.width/2)*100+'%';panel.style.top=(.5-r.height/box.height/2)*100+'%';selectFrame(panel);paintCodeLayers()}],['删除',()=>removeFrame(panel)]]){const button=document.createElement('button');button.type='button';button.textContent=label;button.onclick=action;if(label===panel.dataset.name)button.setAttribute('aria-pressed',panel===selected);row.append(button)}frameList.append(row)}}
function wire(panel){const halo=document.createElement('span');halo.className='glow-halo';halo.setAttribute('aria-hidden','true');panel.prepend(halo);const remove=panel.querySelector('.glass-delete');remove.addEventListener('pointerdown',e=>e.stopPropagation());remove.onclick=e=>{e.stopPropagation();removeFrame(panel)};panel.querySelector('.resize').addEventListener('pointerdown',e=>begin(e,panel,true));panel.addEventListener('pointerdown',e=>{if(e.target.closest('.glass-delete,.resize'))return;begin(e,panel,false)});applyGlass(panel);Hyalite.attach(panel,glassOpts(panel.settings))}
function snapCenter(position,size,pixels){return Math.abs(position+size/2-.5)*pixels<=12?.5-size/2:position}
function begin(e,panel,resizing){e.preventDefault();selectFrame(panel);panel.setPointerCapture(e.pointerId);panel.classList.add('dragging');const box=stage.getBoundingClientRect(),r=panel.getBoundingClientRect();const start={x:e.clientX,y:e.clientY,left:(r.left-box.left)/box.width,top:(r.top-box.top)/box.height,width:r.width/box.width,height:r.height/box.height};let moved=false;const move=ev=>{if(ev.clientX===start.x&&ev.clientY===start.y)return;if(!moved){checkpoint();moved=true}const dx=(ev.clientX-start.x)/box.width,dy=(ev.clientY-start.y)/box.height;if(resizing){if(panel.classList.contains('circle')){const change=Math.abs(ev.clientX-start.x)>Math.abs(ev.clientY-start.y)?dx:dy*box.height/box.width;panel.style.width=Math.max(40/box.width,Math.min(2,start.width+change))*100+'%'}else{panel.style.width=Math.max(40/box.width,Math.min(2,start.width+dx))*100+'%';panel.style.height=Math.max(40/box.height,Math.min(2,start.height+dy))*100+'%'}}else{panel.style.left=snapCenter(start.left+dx,start.width,box.width)*100+'%';panel.style.top=snapCenter(start.top+dy,start.height,box.height)*100+'%'}syncLayoutControls();paintCodeLayers()};const end=()=>{panel.classList.remove('dragging');panel.removeEventListener('pointermove',move);panel.removeEventListener('pointerup',end);panel.removeEventListener('pointercancel',end);syncLayoutControls();paintCodeLayers()};panel.addEventListener('pointermove',move);panel.addEventListener('pointerup',end);panel.addEventListener('pointercancel',end)}
const first=stage.querySelector('.glass');first.dataset.name='圆角框 1';first.settings=structuredClone(defaults);wire(first);selectFrame(first);
function addFrame(circle=false){checkpoint();const p=document.createElement('div');p.className=circle?'glass circle':'glass';p.tabIndex=0;p.dataset.name=(circle?'圆形框 ':'圆角框 ')+(++count);p.settings=structuredClone(selected?.settings||defaults);p.setAttribute('aria-label','可拖动和调整大小的'+p.dataset.name);p.style.left=(12+count*7)%52+'%';p.style.top=(22+count*8)%62+'%';p.style.width=circle?'42%':'54%';if(!circle)p.style.height='22%';p.innerHTML='<button class="glass-delete" type="button" aria-label="删除此玻璃框">×</button><span class="resize" aria-label="调整玻璃框大小"></span>';stage.append(p);wire(p);selectFrame(p);paintCodeLayers()}
document.querySelector('#add').onclick=()=>addFrame();
document.querySelector('#add-circle').onclick=()=>addFrame(true);
document.querySelector('#clear').onclick=()=>{if(!stage.querySelector('.glass'))return;checkpoint();stage.querySelectorAll('.glass').forEach(p=>{Hyalite.detach(p);p.remove()});selectFrame(null);paintCodeLayers()};
document.querySelector('#toggle').onclick=()=>{checkpoint();paused=!paused;stage.classList.toggle('animation-paused',paused);document.querySelector('#toggle').textContent=paused?'继续动画':'暂停动画'};
const toggleUi=()=>document.body.classList.toggle('hide-ui');document.querySelector('#hide').onclick=toggleUi;document.querySelector('#show').onclick=toggleUi;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo();return}if(!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='h')toggleUi();if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){e.preventDefault();document.querySelector('#toggle').click()}});
setFormat(format.value);
background.addEventListener('load',captureLightMap);background.src=BACKGROUND_IMAGE_DATA;
const backgroundUpload=document.querySelector('#background-upload'),backgroundStatus=document.querySelector('#background-status');
backgroundUpload.onchange=()=>{const file=backgroundUpload.files[0];backgroundUpload.value='';if(!file)return;if(!file.type.startsWith('image/')){backgroundStatus.textContent='请选择图片文件';return}const reader=new FileReader();reader.onerror=()=>backgroundStatus.textContent='图片读取失败';reader.onload=()=>{const preview=new Image();preview.onerror=()=>backgroundStatus.textContent='无法打开这张图片';preview.onload=()=>{checkpoint();background.src=reader.result;backgroundStatus.textContent='已上传：'+file.name};preview.src=reader.result};reader.readAsDataURL(file)};
setInterval(()=>{if(!paused&&lightPixels&&codeSettings.speed){codeTime+=.12*codeSettings.speed;drawCode()}},120);
</script>
</body>
